# sgl-kernel-npu Scout catalog. YAML is the source of truth for this scan.
# Extra fields vs CATLASS schema v2.1: relation_to_existing, scout scores,
# variants. Do not run tools/build_catalog.py on this file.
# Does NOT modify cases/ knowledge/ skills/.

schema_version: '2.1-sgl-kernel-npu-scout'
source:
  registry_ref: sgl-kernel-npu
  commit: 8d76a8da75315ae9add5cfd2458b8028289f1ada
  branch: main
  scan_path: /home/wangyibo/sgl-kernel-npu
  official_remote: https://github.com/sgl-project/sgl-kernel-npu.git
  origin_on_scan_path: https://github.com/wangyibo1005/sgl-kernel-npu.git
  identity_note: >
    Local origin is a personal fork on main. Scan commit is
    8d76a8da75315ae9add5cfd2458b8028289f1ada. Sparse Attention Case evidence
    paths were verified on official sgl-project/sgl-kernel-npu main at
    ee334193e5278d7b3a64afcc2e3ee5243133c4a0 (byte-identical to the scan for
    those three files). Whole-tree fetch was not done. Submodules
    third_party/catlass and third_party/pto-isa are not initialized.
    License MIT (not CANN-OSLA).
  execution_schema: >
    execution.task_type is the kernel launch class (aiv_only | mix | aic_only).
    execution.engines is which engines actually work (vector | cube | communication).
    MIX binary with empty AIC is still engines [vector].
  communication_note: >
    communication_pattern is the API/job name (often alltoall). The kernel
    mechanism is MTE-window dest-push unless a close-read says otherwise.
    DeepEP Buffer strategies (HCCS/RDMA/low-latency) are serving packaging,
    not a new window protocol. Do not score strategy switch as engineering_novelty.
scoring:
  axes: [engineering_novelty, cross_source_value, production_relevance, evidence_quality]
  scale: 1-5
  scout_rank: 3*novelty + 3*cross + 2*prod + 2*evidence
  note: >
    File order = bucket then scout_rank desc. Work order is scan_notes
    (DeepEP contrast first, then sparse), which is not scout_rank order.
  existing_cases: >
    CATLASS 43/60/66/68/53/73 plus ops-transformer MoE A/B/C/D (MegaMoe).
    Do not re-teach split-pipeline Layer 1 or MegaMoe Layer 2; use them as baseline.

candidates:

