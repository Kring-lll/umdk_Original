# vllm-ascend Scout catalog. YAML is the source of truth for this scan.
# Candidates are engineering patterns, not file counts.
# Do not run tools/build_catalog.py.

schema_version: '2.1-vllm-ascend-scout'
source:
  registry_ref: vllm-ascend
  official_remote: https://github.com/vllm-project/vllm-ascend.git
  scan_path: /home/wangyibo/vllm-ascend
  origin_on_scan_path: https://github.com/vllm-project/vllm-ascend.git
  commit: d8268faea90dd9b999a0a82f6d133751d57b5770
  branch: main
  identity_note: >
    Official vllm-project checkout. main @ origin/main. Not a fork.
  live_gate_note: >
    enable_custom_op() returns False on AscendDeviceType.A5 (issue 7157).
    950 ACLNN kernels exist in csrc/ and build_aclnn.sh; do not claim they are
    the default A5 inference path until a close-read pins a bypass.
    Which of the two custom-op surfaces that gate applies to is unresolved.
scout_status: passed
scoring:
  axes: [engineering_novelty, cross_source_value, production_relevance, evidence_quality]
  scale: 1-5
  scout_rank: 3*novelty + 3*cross + 2*prod + 2*evidence
  note: >
    Display order = work line P1 → P2 → P3.
    Within each line, bucket / scout_rank guide close-read priority.
    P1/P2/P3 is a dependency order, not a score ranking.
    Do not re-sort this file by bucket then scout_rank.

candidates:

# --- P1 Attention backend → custom op ---

- id: vllma-indexer-selection-producer
  name: Lightning indexer produces select_idx / sparse_indices
  status: candidate
  bucket: priority-curation
  line: p1
  source_path:
    kernel: csrc/attention/vllm_quant_lightning_indexer/
    metadata: csrc/attention/vllm_quant_lightning_indexer_metadata/
    framework: vllm_ascend/models/deepseek_v4/indexer.py
    sfa_torch_npu: vllm_ascend/device/device_op.py  # A5DeviceAdaptor.indexer_select_post_process
  category: compute
  algorithm: sparse-selection-producer
  hardware: [ascend950, a3, a2]
  execution:
    task_type: mix
    engines: [cube, vector]
  memory_pattern: [paged, gather, irregular]
  pipeline_pattern: [producer-consumer]
  communication_pattern: none
  shape_characteristics: >
    Top-k over Q_index @ K_index (optionally quantized) → sparse_indices;
    paged key via block_table; sparse_count (950 README 512 vs A3 2048).
  scores:
    engineering_novelty: 5
    cross_source_value: 5
    production_relevance: 5
    evidence_quality: 4
    scout_rank: 48
  relation_to_existing:
    - case: sparse-attention
      relation: upstream-producer
      shared_mechanism: select_idx / sparse_indices consumed by sparse FA
      new_mechanism: how the framework produces that map (indexer), not the FA loop
    - knowledge: fa-pipeline-online-softmax-and-paged
      relation: not-absorbed
      note: FA Knowledge explicitly excludes select_idx; indexer is the missing producer
  key_techniques:
    - claim: README math is ReLU-filtered QK then weighted Top-k → sparse_indices for sparse attention.
      evidence:
        - kind: design-doc
          path: csrc/attention/vllm_quant_lightning_indexer/README.md
    - claim: DeepSeek-V4 select_topk calls torch.ops._C_ascend.npu_vllm_quant_lightning_indexer.
      evidence:
        - kind: source-code
          path: vllm_ascend/models/deepseek_v4/indexer.py
    - claim: SFA A5 path currently prefers torch_npu.npu_lightning_indexer / npu_quant_lightning_indexer.
      evidence:
        - kind: source-code
          path: vllm_ascend/device/device_op.py
    - claim: sgl-kernel-npu lightning indexer was 950-CMake-off / deferred; this tree has AddConfig ascend950 + arch35.
      evidence:
        - kind: source-code
          path: csrc/attention/vllm_quant_lightning_indexer/op_host/vllm_quant_lightning_indexer_def.cpp
  learn: >
    First close-read. Pin which implementation A5 actually runs (in-tree vs torch_npu)
    given enable_custom_op()==False. If new, Case is indexer only — do not merge with Sparse Case.
  notes: AscendSFAIndexerBackend is cache-only; it does not run this kernel.

