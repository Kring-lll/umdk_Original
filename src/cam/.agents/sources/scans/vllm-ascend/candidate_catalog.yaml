# --- P3 custom-op surfaces (not one serial chain) ---

- id: vllma-custom-op-lifecycle
  name: Framework implementation selection across two custom-op surfaces
  status: candidate
  bucket: knowledge-first
  line: p3
  source_path:
    surface_a_vendor:
      build: csrc/build_aclnn.sh
      install: vllm_ascend/_cann_ops_custom
    surface_b_torch_ext:
      setup: setup.py
      binding: csrc/torch_binding.cpp
    gate: vllm_ascend/utils.py  # enable_custom_op
    adaptor: vllm_ascend/device/device_op.py
  category: integration
  algorithm: framework-custom-op-contract
  hardware: [ascend950, a3, a2]
  scores:
    engineering_novelty: 4
    cross_source_value: 4
    production_relevance: 5
    evidence_quality: 5
    scout_rank: 40
  relation_to_existing:
    - knowledge: none-yet
      relation: new-layer-if-evidence
  key_techniques:
    - claim: Two compile surfaces must not be collapsed into one serial chain.
      evidence:
        - kind: source-code
          path: csrc/build_aclnn.sh
        - kind: source-code
          path: setup.py
        - kind: source-code
          path: csrc/torch_binding.cpp
    - claim: A5 enable_custom_op() currently returns False (issue 7157); which surface it gates is unresolved.
      evidence:
        - kind: source-code
          path: vllm_ascend/utils.py
  learn: >
    Framework semantic op → implementation selection, then a fork:

        torch_npu / ACLNN              _C_ascend torch extension
            vendor / CANN op               in-tree C++ binding
            Host / kernel                  Host / kernel

    Do not write Framework → torch.ops → ACLNN/csrc → kernel as one pipeline.
    Which surface enable_custom_op() gates on A5, and whether _C_ascend
    direct calls bypass it, is P1/P3 close-read — Scout does not conclude.
    Do not preset knowledge/engineering-experience/framework-to-custom-op-contracts.md.
    If evidence is enough after P1/P2, Knowledge or workflows/ — never cases/compute/.
