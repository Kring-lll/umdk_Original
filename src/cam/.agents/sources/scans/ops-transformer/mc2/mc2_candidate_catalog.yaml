  case_path: cases/compute-communication/mc2/ascend950-alltoall-matmul-pipeline/
  canonical_op: allto_all_matmul
  comm_job_vs_mechanism: >
    Job AllToAll. Mechanism MC2AlltoAllPrimitives AlltoAll<false>
    via HcclCommunicator. Commit = communication progress.
    Wait = consumer gate. Commit is not cross-rank visibility.
    AICSync=false (AIV0).
  overlap_unit: taskIndex; pipeline permits overlap (unmeasured)
  same_device_sync: CrossCoreSetFlag 8/9 AIC↔AIV; SyncAll AIV
  do_not: two Cases for the two orders; not 43; Commit ≠ visibility

