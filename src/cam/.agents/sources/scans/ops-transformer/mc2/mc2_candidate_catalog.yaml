- id: mc2-m1-asw-hccl-chunk
  name: ASW Cube MM + HCCL collective chunk coupling
  status: first-case-accepted
  bucket: first-case
  coupling_family: M1
  live_950_ops:
    - all_gather_matmul_v2          # confirmed: M-tile gather → MM
    - matmul_reduce_scatter_v2      # confirmed: M-tile MM → RS (native); 4P/8P default may be A2A+vec sibling
    - matmul_all_reduce             # confirmed M1 member: AllReduce<false>(repeat=tileCnt) + Commit; not handle-per-chunk
  not_live_950:
    - all_gather_matmul             # v1 wrapper
    - matmul_reduce_scatter         # v1 wrapper
    - matmul_all_reduce_add_rms_norm
    - grouped_mat_mul_all_reduce
  kernel_stack: mc2/common/op_kernel/mc2_mat_mul_asw_kernel.h
  comm_job_vs_mechanism: >
    Job names AllGather / ReduceScatter / AllReduce.
    AG/RS native: Hccl::* per chunk + Wait(handle).
    RS may instead be A2A+vec reduce (TPL_CCU_ALL2ALL_VEC_REDUCE) — not native RS.
    AR native: one AllReduce<false>(..., tileCnt) + per-turn Commit + Wait(same handle × N).
    Do not claim M1 is handle-per-M-tile.
  overlap_unit:
    ag: M-tile
    rs: M-tile
    ar: M-tile / AllReduce repeat
  confirmed:
    ag: M-tile / rank-M gather → MM
    rs: M-tile MM → ReduceScatter
    ar: M-tile MM → AllReduce repeat
  ownership:
    ag: local/remote A shard → gathered input → full C
    rs: MM C chunk → RS input → rank-local C shard
    ar: MM partial chunk → AR input → full Y
  why_first_case_pool: >
    Canonical Case is native RS. AG is reverse sibling on that card.
    AR is M1 member / morphology evidence; no AR Case.
  close_read_ar: sources/scans/ops-transformer/mc2/close_reads/mc2_mm_all_reduce_native.md
  verdict_ar: sources/scans/ops-transformer/mc2/close_reads/mc2_m1_ar_verdict.md
