# ops-transformer Scout catalog. YAML is the source of truth for this scan.
# Extra fields vs CATLASS schema v2.1: relation_to_existing, scout scores,
# variants, `line` (frozen-done | backlog). Do not run tools/build_catalog.py.
# MoE line frozen 2026-08-21. Remaining candidates are ops-transformer backlog.

schema_version: '2.1-ops-transformer-scout'
source:
  registry_ref: ops-transformer
  commit: 9311b63bcd065b9779eb08a7d634e9463ee41ef1
  branch: master
  scan_path: /home/wangyibo/ops-transformer_bak
  official_remote: https://gitcode.com/cann/ops-transformer.git
  origin_on_scan_path: git@gitcode.com:wang_yibo/ops-transformer.git
  moe_line: frozen
  identity_note: >
    Local origin is a personal fork on master. cann/ops-transformer was not fetched
    this close-read. DeepEP A3 dirs are absent on this master (were Add-4-op only).
  execution_schema: >
    execution.task_type is the kernel launch class (aiv_only | mix | aic_only).
    execution.engines is which engines actually work (vector | cube | communication).
    MIX binary with empty AIC is still engines [vector].
scoring:
  axes: [engineering_novelty, cross_source_value, production_relevance, evidence_quality]
  scale: 1-5
  scout_rank: 3*novelty + 3*cross + 2*prod + 2*evidence
  note: Sort by bucket then scout_rank desc. Uniqueness is not a score.

candidates:

