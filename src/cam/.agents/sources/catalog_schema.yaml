# AscendWeaver Candidate Catalog Schema v2.1
# Frozen. YAML is the only source of truth. Markdown is generated by
# tools/build_catalog.py. Do not hand-edit candidate_catalog.md.

schema_version: "2.1"

enums:
  category:
    - compute
    - communication
    - compute-communication
  hardware:
    - ascend950
    - a5
    - a3
    - a2
    - generic
    - unknown
  compute_engine:
    - vector
    - cube
    - vector+cube
    - simt
    - mixed
  memory_pattern:
    - continuous
    - strided
    - transpose
    - gather
    - scatter
    - broadcast
    - reduce
    - reuse
    - double-buffer
    - irregular
    - workspace
    - shared-window
  pipeline_pattern:
    - copy-compute-copy
    - double-buffer
    - multi-stage
    - vector-cube-overlap
    - communication-compute-overlap
    - producer-consumer
  communication_pattern:
    - none
    - send-recv
    - allreduce
    - allgather
    - reduce-scatter
    - alltoall
    - dispatch
    - combine
  evidence_kind:
    - source-code
    - design-doc
    - official-doc
    - test
    - benchmark
    - inference
  bucket:
    - priority-curation
    - cross-source-review
    - knowledge-first
    - deferred
  status:
    - discovered
    - candidate
    - shortlisted
    - curated
    - reviewed
    - accepted
    - deprecated
  competes_relation:
    - duplicate
    - alternative
    - sibling
    - baseline
    - complement
  competes_review_state:
    - pending
    - compared
    - rejected
    - selected

bucket_rank:
  priority-curation: 1
  cross-source-review: 2
  knowledge-first: 3
  deferred: 4

sort_order:
  - bucket_rank: asc
  - intrinsic_case_score: desc
  - project_priority: desc
  - id: asc

scoring:
  intrinsic_max: 80
  intrinsic_formula:
    representative: 5
    optimization: 4
    reusability: 3
    implementation: 3
    documentation: 1
  project_priority_scale: [1, 2, 3, 4, 5]

dtypes:
  keys: [input, output, accumulator, scale]
  unused_is_empty_list: true

source_identity:
  catalog_level:
    - registry_ref
    - commit
    - branch
    - scan_path
  registry_owns:
    - repository
    - remote_url
    - organization
    - license

lifecycle:
  note: bucket = next action; status = how far this candidate has been processed.
  typical:
    - candidate
    - shortlisted
    - curated
    - reviewed
    - accepted
