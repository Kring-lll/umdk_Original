# Main UE EID test configuration.
#
# Test sources are resolved from the directory containing this config file.
# Kernel and UMDK repos may live anywhere; set KERNEL_REPO and UMDK_REPO when
# they are not placed beside this test directory.

MAIN_UE_EID_TEST_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
KERNEL_REPO="${KERNEL_REPO:-${MAIN_UE_EID_TEST_ROOT}/kernel}"
UMDK_REPO="${UMDK_REPO:-${MAIN_UE_EID_TEST_ROOT}/umdk}"
UMDK_SRC_DIR="${UMDK_SRC_DIR:-${UMDK_REPO}/src}"
UMDK_BUILD_DIR="${UMDK_BUILD_DIR:-${UMDK_SRC_DIR}/build}"

TEST_SRC="${TEST_SRC:-${MAIN_UE_EID_TEST_ROOT}/main_primary_eid_debug_test.c}"
TEST_BIN="${TEST_BIN:-/tmp/main_primary_eid_debug_test}"
CONCURRENCY_TEST_SRC="${CONCURRENCY_TEST_SRC:-${MAIN_UE_EID_TEST_ROOT}/main_primary_eid_concurrency_test.c}"
CONCURRENCY_TEST_BIN="${CONCURRENCY_TEST_BIN:-/tmp/main_primary_eid_concurrency_test}"
SET_TOPO_SRC="${SET_TOPO_SRC:-${MAIN_UE_EID_TEST_ROOT}/main_primary_eid_set_topo.c}"
SET_TOPO_BIN="${SET_TOPO_BIN:-/tmp/main_primary_eid_set_topo}"
FTRACE_STRESS_SRC="${FTRACE_STRESS_SRC:-${MAIN_UE_EID_TEST_ROOT}/main_primary_eid_ftrace_stress.c}"
FTRACE_STRESS_BIN="${FTRACE_STRESS_BIN:-/tmp/main_primary_eid_ftrace_stress}"
RUNTIME_ENV_FILE="${RUNTIME_ENV_FILE:-${MAIN_UE_EID_TEST_ROOT}/.main_primary_eid_debug.env}"

# Kernel module build/load controls.
BUILD_KERNEL_MODULES="${BUILD_KERNEL_MODULES:-1}"
LOAD_KERNEL_MODULES="${LOAD_KERNEL_MODULES:-0}"
FORCE_RELOAD_MODULES="${FORCE_RELOAD_MODULES:-0}"
LOAD_EXTRA_URMA_MODULES="${LOAD_EXTRA_URMA_MODULES:-0}"
KERNEL_BUILD_DIR="${KERNEL_BUILD_DIR:-$(dirname /lib/modules/*/build 2>/dev/null | head -n 1)/build}"
KERNEL_M_DIR="${KERNEL_M_DIR:-${KERNEL_REPO}/drivers/ub/urma}"
KERNEL_EXTRA_CFLAGS="${KERNEL_EXTRA_CFLAGS:--I${KERNEL_REPO}/include}"

# UMDK build controls.
BUILD_UMDK="${BUILD_UMDK:-1}"
INSTALL_UMDK_LIBS="${INSTALL_UMDK_LIBS:-0}"
LIBTPSA_DIR="${LIBTPSA_DIR:-}"
UMDK_CMAKE_OPTIONS="${UMDK_CMAKE_OPTIONS:--DBUILD_URMA=enable -DBUILD_ALL=disable -DBUILD_UDMA=disable}"

# Test run controls.
RUN_WITH_SUDO="${RUN_WITH_SUDO:-1}"
TEST_ARGS="${TEST_ARGS:-}"
CONCURRENCY_TEST_ARGS="${CONCURRENCY_TEST_ARGS:-}"
SET_TOPO_ARGS="${SET_TOPO_ARGS:-}"
