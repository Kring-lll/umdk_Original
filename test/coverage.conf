[coverage]
# Line coverage threshold (percentage)
line_coverage_threshold = 70

# Branch coverage threshold (percentage)
branch_coverage_threshold = 60

# Function coverage threshold (percentage)
function_coverage_threshold = 80

# Minimum coverage for new code
new_code_threshold = 75

[report]
# Output directory for coverage reports
output_dir = test/coverage_reports

# Report format: html, xml, json
format = html

# Include branch coverage
branch_coverage = true

# Exclude patterns
exclude_patterns = [
    "*test*",
    "*mock*",
    "*example*",
    "*third_party*",
    "*c++/*",
    "*gtest/*"
]

[modules]
# Module-specific thresholds
urpc = 70
urma = 60
dlock = 65
ums = 60
cam = 50

[ci]
# Fail build if coverage below threshold
fail_on_threshold = true

# Generate badge
generate_badge = true

# Upload to codecov
upload_codecov = false
codecov_token = ""